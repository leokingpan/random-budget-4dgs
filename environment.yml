name: rbt4dgs
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cuda-nvcc=12.1.105
  - cuda-cudart-dev=12.1.105
  - gxx_linux-64
  - pip:
    - matplotlib
    - lpips
    - plyfile
    - pytorch_msssim
    - open3d
    - imageio[ffmpeg]
    - opencv-python
    - pillow<11
